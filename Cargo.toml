[package]
name = "claude-profile-switcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Claude CodeのToken使用量とセッションを常駐監視して可視化するツール"

[[bin]]
name = "cps"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
ureq = { version = "3.4.2", features = ["json"] }
notify = "8.2.0"
directories = "6.0.0"
sha2 = "0.11.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
testcontainers = { version = "0.28.0", features = ["blocking"] }
