[package]
name = "claude-profile-switcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Claude CodeのToken使用量とセッションを常駐監視して可視化するツール"

[[bin]]
name = "cps"
path = "src/main.rs"

[dependencies]
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
ureq = { version = "3.4.2", features = ["json"] }
notify = "8.2.0"
directories = "6.0.0"
sha2 = "0.11.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# 描画はglow（OpenGL）にする。macOSで実測したGUIの物理フットプリントが、wgpuの253MBに対してglowは191MBだった。
# 既定機能からwgpuとWeb専用の読み上げだけを外し、アクセシビリティ（accesskit）とLinuxのwayland、x11は残す。
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "wayland", "x11"] }
egui = "0.36.2"
egui_plot = "0.37.0"
egui-phosphor = "0.14.0"
notify-rust = "4.18.0"
tray-icon = "0.25.1"
auto-launch = "0.6.0"
winit = "0.30.13"

[dev-dependencies]
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
testcontainers = { version = "0.28.0", features = ["blocking"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = "0.4.45"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# wgpuとsnapshotは、README用の画像を画面外で描くtests/readme_images.rsだけが使う。
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu", "snapshot"] }
