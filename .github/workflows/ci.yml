name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: okamyuji/reusable-workflows/.github/workflows/rust-ci.yml@feat/rust-ci-apt-packages
    with:
      # トレイ（tray-icon）とメニュー（muda）がLinuxでGTK、libxdo、AppIndicatorを使う。
      apt-packages: libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1
